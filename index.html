<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026년 5월 25일 호우 대응 관련 3개 부처의 보도자료를 검색하고 열람합니다.">
  <title>5.25 호우 대응 3부처 보도자료 검색</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="container">
      <p class="eyebrow">부처 합동 보도자료 · 자료 열람</p>
      <h1>5.25 호우 대응<br>3부처 보도자료 검색</h1>
      <p class="intro">행정안전부 · 기상청 · 경찰청 보도자료를 한 곳에서 확인하세요.</p>
    </div>
  </header>
  <main class="container">
    <section class="search-panel" aria-label="보도자료 검색">
      <label for="q">보도자료 검색</label>
      <div class="search-row">
        <input id="q" type="search" placeholder="제목 · 부처 · 본문에서 검색 (예: 16:30)" autocomplete="off">
        <button type="button" id="clear">초기화</button>
      </div>
      <div class="results-header">
        <h2>보도자료 목록</h2>
        <span id="count" role="status" aria-live="polite"></span>
      </div>
    </section>
    <section id="list" class="card-grid" aria-label="검색된 보도자료"></section>
    <p class="disclaimer">※ 제공된 가상 자료를 원문 그대로 표시합니다. 부처 간 수치가 다를 수 있습니다.</p>
  </main>
  <footer>2026년 5월 25일 호우 대응 · 3부처 보도자료 검색</footer>
  <script src="데이터.js"></script>
  <script src="app.js"></script>
</body>
</html>
